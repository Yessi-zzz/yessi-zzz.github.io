site_name: Yessi的个人网站
site_url: https://yessi-zzz.github.io/
extra_css:
  - stylesheets/extra.css

theme:
  name: material
  palette:
    # 浅色模式（默认跟随系统：prefers-color-scheme: light）
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: orange
      accent: pink
      toggle:
        icon: material/weather-sunny   # 太阳图标，点击切到深色
        name: 切换到深色模式
    # 深色模式（默认跟随系统：prefers-color-scheme: dark）
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: orange
      accent: pink
      toggle:
        icon: material/weather-night   # 月亮图标，点击切回浅色
        name: 切换到浅色模式
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tracking # 追踪并高亮当前活动页面
    - navigation.tabs # 标签页导航，移动设备不显示
    - navigation.path
    - navigation.top # back to top 按钮
    - toc.follow
    - search.suggest # 搜索建议
    - search.highlight # 高亮搜索结果
    - navigation.indexes # 会有一个index页面,而不是打开tab的第一篇文章
    - navigation.expand # 核心功能：允许展开和收缩菜单
    - navigation.footer # 页脚的上一页/下一页导航
    - content.code.copy # 代码块右上角的一键复制按钮
    - content.code.annotate # 代码块内可添加可点击的注释气泡

# markdown扩展
markdown_extensions:  # 支持数学公式 such as LaTeX, MathML, AsciiMath
  - pymdownx.arithmatex:
      generic: true
  - attr_list # 图像对齐功能
  - md_in_html
  - pymdownx.blocks.caption
  # 代码高亮 + 围栏代码块（content.code.copy / annotate 的前提）
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite # 行内代码高亮
  - pymdownx.superfences # 围栏代码块 + 代码注释支持
  - admonition # callout / 提示框 (!!! note 等)
  - pymdownx.details # 可折叠 admonition (??? / ???+)

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github 
      link: https://github.com/Yessi-zzz
    - icon: fontawesome/brands/bilibili
      link: https://space.bilibili.com/290156913?spm_id_from=333.40138.0.0
  consent:
    title: Cookie consent
    description: >- 
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the effectiveness of our documentation and whether users
      find what they're searching for. With your consent, you're helping us to
      make our documentation better.

# 插件
plugins:
  - social:
      enabled: true
      cache: true
      cache_dir: .cache/plugins/social
      cards: true
      log: true
      cards_dir: assets/images/social
      cards_layout_dir: layouts
      debug: true
      debug_on_build: false
      debug_grid: true
      debug_grid_step: 32
      debug_color: yellow
  - meta:
      enabled: true
  - blog:
      archive: false
  - tags
  - search
  - rss:
      match_path: blog/posts/.* 
      date_from_meta:
        as_creation: date
      categories:
        - categories
        - tags 

# 导航栏
nav:
  - 我:
    - Yessi/index.md
    - Desktop & Everyday items:
      - 电脑: Yessi/Desktop/PC.md
      - 手机&平板: Yessi/Desktop/phone.md
      - 耳机: Yessi/Desktop/earphone.md
      - 游戏&外设: Yessi/Desktop/game&eqs.md
      - 拍摄设备: Yessi/Desktop/shooting eqs.md
      - 配件: Yessi/Desktop/accessories.md
      - 日常使用: Yessi/Desktop/everyday items.md
      - 穿搭: Yessi/Desktop/clothes.md
    - 食谱: Yessi/recipe.md
  - Notes:
    - notes/index.md
    - Codes:
      - Dp codes:
        - Fibonacci Sequence: notes/codes/Fibonacci Number.md
        - Knapsack Problem: notes/codes/Knapsack Problem.md
    - Dynamic Programming:
      - DP/index.md
      - Two approaches to DP: DP/Two approaches of DP.md
      - Steps to solve DP problems: DP/Steps to solve a DP Problem.md
      - 快艇骰子研究:
        - Rules: DP/yahtzee/Rules.md
    - Tools:
      - Git & GitHub: notes/tools/Git-GitHub.md
